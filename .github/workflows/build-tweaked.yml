name: Build tweaked upstream release

# Rebuilds the latest public release of MCMrARM/mc-w10-version-launcher with the fixes from
# tools/apply_fixes.py applied, and publishes it as a release with the SAME tag as upstream.
# This fork's own source code is not used, so syncing the fork with upstream never conflicts.
#
# - schedule : builds only when upstream has a release this fork has not published yet.
# - push     : rebuilds the current upstream release (the fix script changed).
# - dispatch : always builds (optionally a specific upstream release tag).
# - Only the newest build artifact is kept; the release assets are the permanent copies.

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Upstream release tag to build (empty = latest public release)'
        required: false
        default: ''
      allow_missing:
        description: 'Keep going even if a fix can not be applied (artifact only, no release is published)'
        type: boolean
        default: false
  schedule:
    - cron: '0 3 * * *'   # daily 03:00 UTC: cheap check, builds only when a new upstream release appears
  push:
    paths:
      - 'tools/**'
      - '.github/workflows/build-tweaked.yml'

concurrency:
  group: build-tweaked
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      build: ${{ steps.v.outputs.build }}
      exists: ${{ steps.v.outputs.exists }}
      is_latest: ${{ steps.v.outputs.is_latest }}
    steps:
      - name: Resolve upstream release
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.upstream_tag }}
          EVENT: ${{ github.event_name }}
        run: |
          latest=$(gh api repos/MCMrARM/mc-w10-version-launcher/releases/latest --jq .tag_name)
          tag="${INPUT_TAG:-$latest}"
          if [ -z "$tag" ]; then
            echo "Upstream has no public release." >&2
            exit 1
          fi

          is_latest=false
          if [ "$tag" = "$latest" ]; then is_latest=true; fi

          exists=false
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exists=true; fi

          build=true
          if [ "$EVENT" = "schedule" ] && [ "$exists" = "true" ]; then build=false; fi

          {
            echo "tag=$tag"
            echo "build=$build"
            echo "exists=$exists"
            echo "is_latest=$is_latest"
          } >> "$GITHUB_OUTPUT"
          echo "Upstream release: $tag (already released here: $exists, build: $build)" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    permissions:
      contents: write   # create/update the release
      actions: write    # delete old artifacts
    env:
      TAG: ${{ needs.check.outputs.tag }}
      ARTIFACT_NAME: MCLauncher-tweaked
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout this repo (fix script)
        uses: actions/checkout@v4
        with:
          path: fork

      - name: Checkout upstream release
        uses: actions/checkout@v4
        with:
          repository: MCMrARM/mc-w10-version-launcher
          ref: ${{ needs.check.outputs.tag }}
          path: src

      # Optional: put your icon at tools/app-icon.ico to embed it into MCLauncher.exe.
      - name: Copy icon
        shell: pwsh
        run: |
          if (Test-Path fork/tools/app-icon.ico) {
            Copy-Item fork/tools/app-icon.ico src/MCLauncher/app-icon.ico
            "Icon copied."
          } else {
            "No tools/app-icon.ico in the fork; building without a custom icon."
          }

      - name: Apply fixes
        shell: pwsh
        env:
          ALLOW_MISSING: ${{ inputs.allow_missing && '1' || '0' }}
        run: python -I fork/tools/apply_fixes.py src

      # GPLv3 section 6: the release must come with the Corresponding Source.
      # This is the upstream release source with the fixes already applied (taken before building).
      - name: Archive modified source
        shell: pwsh
        run: |
          tar -a -c -f "MCLauncher-$env:TAG-tweaked-source.zip" --exclude=.git -C src .
          Get-Item "MCLauncher-$env:TAG-tweaked-source.zip" | Select-Object Name, Length

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSBuild (Visual Studio C++ toolset)
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      # WUTokenHelper uses packages.config (C++/WinRT); the C# project uses PackageReference.
      - name: Restore packages
        working-directory: src
        run: |
          nuget restore MCLauncher.sln
          msbuild MCLauncher.sln /t:Restore /p:Configuration=Release /p:Platform=x64

      - name: Build
        working-directory: src
        run: msbuild MCLauncher.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Collect output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Path "src\x64\Release\*" -Destination dist -Recurse -Force
          Get-ChildItem dist -Recurse -Include *.pdb,*.ilk,*.iobj,*.ipdb | Remove-Item -Force
          # GPLv3: ship the license text and mark this as a modified version (section 5a).
          Copy-Item src\LICENSE.txt dist\LICENSE.txt
          $today = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
          @(
            "This is an UNOFFICIAL, MODIFIED build of MCLauncher (MCMrARM/mc-w10-version-launcher)."
            "It is NOT the official release. Do not report problems with it to the original author."
            ""
            "Upstream release: $env:TAG"
            "Upstream commit: $(git -C src rev-parse HEAD)"
            "Modified by: $env:GITHUB_REPOSITORY (changes: tools/apply_fixes.py)"
            "Fix script commit: $env:GITHUB_SHA"
            "Built on: $today (UTC)"
            ""
            "Licensed under the GNU General Public License v3 (see LICENSE.txt)."
            "Corresponding source: the 'MCLauncher-$env:TAG-tweaked-source.zip' asset of the same release,"
            "or https://github.com/MCMrARM/mc-w10-version-launcher/tree/$env:TAG plus tools/apply_fixes.py at the fix script commit above."
          ) | Out-File dist\BUILD_INFO.txt -Encoding utf8
          Get-ChildItem dist | Select-Object Name, Length

      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist
          if-no-files-found: error

      # Keep only the artifact that was just uploaded.
      - name: Delete older artifacts
        shell: pwsh
        env:
          CURRENT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          $ids = gh api --paginate "repos/$env:GITHUB_REPOSITORY/actions/artifacts?name=$env:ARTIFACT_NAME&per_page=100" --jq '.artifacts[].id'
          foreach ($id in $ids) {
            if ("$id" -ne "$env:CURRENT_ID") {
              gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$id"
              "Deleted old artifact $id"
            }
          }

      # Release uses exactly the upstream tag and title. Skipped when fixes were allowed to be missing.
      - name: Publish release
        if: ${{ !inputs.allow_missing }}
        shell: pwsh
        env:
          EXISTS: ${{ needs.check.outputs.exists }}
          IS_LATEST: ${{ needs.check.outputs.is_latest }}
        run: |
          $asset = "MCLauncher-$env:TAG-tweaked-x64.zip"
          Compress-Archive -Path dist\* -DestinationPath $asset -Force

          $upstreamSha = git -C src rev-parse HEAD
          $source = "MCLauncher-$env:TAG-tweaked-source.zip"
          $today = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
          @(
            "**Unofficial, modified build** of upstream release [$env:TAG](https://github.com/MCMrARM/mc-w10-version-launcher/releases/tag/$env:TAG) by MCMrARM, with the changes from ``tools/apply_fixes.py`` applied. Not affiliated with the original author. Built on $today (UTC)."
            ""
            "Licensed under GPLv3, same as upstream. The complete corresponding source (upstream source with the changes applied) is attached as ``$source``."
            ""
            "- Upstream commit: $upstreamSha"
            "- Fix script commit: $env:GITHUB_SHA"
          ) | Out-File notes.md -Encoding utf8

          if ($env:EXISTS -eq 'true') {
            gh release upload $env:TAG $asset $source --clobber
            gh release edit $env:TAG --title $env:TAG --notes-file notes.md --latest=$env:IS_LATEST
          } else {
            gh release create $env:TAG $asset $source --title $env:TAG --notes-file notes.md --target $env:GITHUB_SHA --latest=$env:IS_LATEST
          }
