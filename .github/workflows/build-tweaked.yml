name: Build tweaked upstream release

# Builds MCMrARM/mc-w10-version-launcher with the fixes from tools/apply_fixes.py applied and
# publishes the result as a release of THIS fork.
# This fork's own source code is not used, so syncing the fork with upstream never conflicts.
#
# What is built (decided automatically in the "check" job):
#   1. The latest public upstream release, if the fixes apply to it. The release here gets the SAME
#      tag and title as upstream (exact version match) and can be marked "Latest".
#   2. Otherwise (the fixes were written for newer upstream code than the release contains), the
#      upstream default branch. The release is then a PRE-RELEASE tagged "<upstream tag>+master.<sha7>",
#      so it can never be mistaken for the official version.
#
# - schedule : builds only when the release/tag that would be published does not exist here yet.
# - push     : rebuilds (the fix script changed).
# - dispatch : always builds (optionally a specific upstream release tag).
# - Only the newest build artifact is kept; the release assets are the permanent copies.

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Upstream release tag to build (empty = latest release, or the default branch if the fixes do not apply to it)'
        required: false
        default: ''
      allow_missing:
        description: 'Keep going even if a fix can not be applied (artifact only, no release is published)'
        type: boolean
        default: false
  schedule:
    - cron: '0 3 * * *'   # daily 03:00 UTC: cheap check, builds only when there is something new
  push:
    paths:
      - 'tools/**'
      - '.github/workflows/build-tweaked.yml'

concurrency:
  group: build-tweaked
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.v.outputs.mode }}
      source_sha: ${{ steps.v.outputs.source_sha }}
      base_tag: ${{ steps.v.outputs.base_tag }}
      release_tag: ${{ steps.v.outputs.release_tag }}
      file_tag: ${{ steps.v.outputs.file_tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      is_latest: ${{ steps.v.outputs.is_latest }}
      exists: ${{ steps.v.outputs.exists }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - name: Resolve upstream release and default branch
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.upstream_tag }}
        run: |
          up=repos/MCMrARM/mc-w10-version-launcher
          latest=$(gh api $up/releases/latest --jq .tag_name)
          tag="${INPUT_TAG:-$latest}"
          if [ -z "$tag" ]; then
            echo "Upstream has no public release." >&2
            exit 1
          fi
          branch=$(gh api $up --jq .default_branch)
          {
            echo "latest=$latest"
            echo "tag=$tag"
            echo "sha=$(gh api $up/commits/$tag --jq .sha)"
            echo "head=$(gh api $up/commits/$branch --jq .sha)"
            echo "explicit=$([ -n "$INPUT_TAG" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout this repo (fix script)
        uses: actions/checkout@v4
        with:
          path: fork

      - name: Checkout upstream release
        uses: actions/checkout@v4
        with:
          repository: MCMrARM/mc-w10-version-launcher
          ref: ${{ steps.rel.outputs.sha }}
          path: src

      # Dry run on the release source: do the fixes apply to it?
      - name: Check whether the fixes apply to the release
        id: dry
        run: |
          if python3 -I fork/tools/apply_fixes.py src; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide what to build
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ALLOW_MISSING: ${{ inputs.allow_missing && 'true' || 'false' }}
          TAG: ${{ steps.rel.outputs.tag }}
          LATEST: ${{ steps.rel.outputs.latest }}
          SHA: ${{ steps.rel.outputs.sha }}
          HEAD_SHA: ${{ steps.rel.outputs.head }}
          EXPLICIT: ${{ steps.rel.outputs.explicit }}
          DRY_OK: ${{ steps.dry.outputs.ok }}
        run: |
          prerelease=false
          is_latest=false
          if [ "$DRY_OK" = "true" ]; then
            mode=release
            source_sha="$SHA"
            release_tag="$TAG"
            if [ "$TAG" = "$LATEST" ]; then is_latest=true; fi
          elif [ "$EXPLICIT" = "true" ] && [ "$ALLOW_MISSING" != "true" ]; then
            echo "The fixes do not apply to upstream release $TAG. Update tools/apply_fixes.py, or run with allow_missing." >&2
            exit 1
          elif [ "$EXPLICIT" = "true" ]; then
            mode=release
            source_sha="$SHA"
            release_tag="$TAG"
          elif [ "$HEAD_SHA" = "$SHA" ] && [ "$ALLOW_MISSING" != "true" ]; then
            echo "The fixes do not apply to the latest upstream release $TAG (which is also the default branch head). Update tools/apply_fixes.py." >&2
            exit 1
          else
            # The release is older than the code the fixes were written for: build the default branch.
            mode=master
            source_sha="$HEAD_SHA"
            release_tag="$TAG+master.${HEAD_SHA:0:7}"
            prerelease=true
          fi

          exists=false
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exists=true; fi

          build=true
          if [ "$EVENT" = "schedule" ] && [ "$exists" = "true" ]; then build=false; fi

          {
            echo "mode=$mode"
            echo "source_sha=$source_sha"
            echo "base_tag=$TAG"
            echo "release_tag=$release_tag"
            echo "file_tag=${release_tag//+/-}"
            echo "prerelease=$prerelease"
            echo "is_latest=$is_latest"
            echo "exists=$exists"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"
          echo "Mode: $mode, release tag: $release_tag, upstream commit: $source_sha (already released here: $exists, build: $build)" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    permissions:
      contents: write   # create/update the release
      actions: write    # delete old artifacts
    env:
      MODE: ${{ needs.check.outputs.mode }}
      BASE_TAG: ${{ needs.check.outputs.base_tag }}
      RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
      FILE_TAG: ${{ needs.check.outputs.file_tag }}
      ARTIFACT_NAME: MCLauncher-tweaked
      GH_TOKEN: ${{ github.token }}
      # The workspace root is not a git repository (checkouts are in fork/ and src/), so gh must be told the repo.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout this repo (fix script)
        uses: actions/checkout@v4
        with:
          path: fork

      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: MCMrARM/mc-w10-version-launcher
          ref: ${{ needs.check.outputs.source_sha }}
          path: src

      # Optional: put your icon at tools/app-icon.ico to embed it into MCLauncher.exe.
      - name: Copy icon
        shell: pwsh
        run: |
          if (Test-Path fork/tools/app-icon.ico) {
            Copy-Item fork/tools/app-icon.ico src/MCLauncher/app-icon.ico
            "Icon copied."
          } else {
            "No tools/app-icon.ico in the fork; building without a custom icon."
          }

      - name: Apply fixes
        shell: pwsh
        env:
          ALLOW_MISSING: ${{ inputs.allow_missing && '1' || '0' }}
        run: python -I fork/tools/apply_fixes.py src

      # GPLv3 section 6: the release must come with the Corresponding Source.
      # This is the upstream source with the fixes already applied (taken before building).
      - name: Archive modified source
        shell: pwsh
        run: |
          tar -a -c -f "MCLauncher-$env:FILE_TAG-tweaked-source.zip" --exclude=.git -C src .
          Get-Item "MCLauncher-$env:FILE_TAG-tweaked-source.zip" | Select-Object Name, Length

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSBuild (Visual Studio C++ toolset)
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      # WUTokenHelper uses packages.config (C++/WinRT); the C# project uses PackageReference.
      - name: Restore packages
        working-directory: src
        run: |
          nuget restore MCLauncher.sln
          msbuild MCLauncher.sln /t:Restore /p:Configuration=Release /p:Platform=x64

      - name: Build
        working-directory: src
        run: msbuild MCLauncher.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Collect output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Path "src\x64\Release\*" -Destination dist -Recurse -Force
          Get-ChildItem dist -Recurse -Include *.pdb,*.ilk,*.iobj,*.ipdb | Remove-Item -Force
          # GPLv3: ship the license text and mark this as a modified version (section 5a).
          Copy-Item src\LICENSE.txt dist\LICENSE.txt
          $today = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
          $sha = git -C src rev-parse HEAD
          if ($env:MODE -eq 'master') {
            $base = "Built from the upstream default branch (newer than upstream release $env:BASE_TAG, NOT an official release)"
          } else {
            $base = "Upstream release: $env:BASE_TAG"
          }
          @(
            "This is an UNOFFICIAL, MODIFIED build of MCLauncher (MCMrARM/mc-w10-version-launcher)."
            "It is NOT the official release. Do not report problems with it to the original author."
            ""
            $base
            "Upstream commit: $sha"
            "Modified by: $env:GITHUB_REPOSITORY (changes: tools/apply_fixes.py)"
            "Fix script commit: $env:GITHUB_SHA"
            "Built on: $today (UTC)"
            ""
            "Licensed under the GNU General Public License v3 (see LICENSE.txt)."
            "Corresponding source: the 'MCLauncher-$env:FILE_TAG-tweaked-source.zip' asset of the same release,"
            "or https://github.com/MCMrARM/mc-w10-version-launcher/tree/$sha plus tools/apply_fixes.py at the fix script commit above."
          ) | Out-File dist\BUILD_INFO.txt -Encoding utf8
          Get-ChildItem dist | Select-Object Name, Length

      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist
          if-no-files-found: error

      # Keep only the artifact that was just uploaded.
      - name: Delete older artifacts
        shell: pwsh
        env:
          CURRENT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          $ids = gh api --paginate "repos/$env:GITHUB_REPOSITORY/actions/artifacts?name=$env:ARTIFACT_NAME&per_page=100" --jq '.artifacts[].id'
          foreach ($id in $ids) {
            if ("$id" -ne "$env:CURRENT_ID") {
              gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$id"
              "Deleted old artifact $id"
            }
          }

      # A release build uses exactly the upstream tag and title; a master build is a pre-release.
      # Skipped when fixes were allowed to be missing.
      - name: Publish release
        if: ${{ !inputs.allow_missing }}
        shell: pwsh
        env:
          EXISTS: ${{ needs.check.outputs.exists }}
          IS_LATEST: ${{ needs.check.outputs.is_latest }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          $asset = "MCLauncher-$env:FILE_TAG-tweaked-x64.zip"
          Compress-Archive -Path dist\* -DestinationPath $asset -Force
          $source = "MCLauncher-$env:FILE_TAG-tweaked-source.zip"

          $upstreamSha = git -C src rev-parse HEAD
          $today = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
          if ($env:MODE -eq 'master') {
            $what = "**Unofficial, modified pre-release.** Built from the upstream default branch at commit [$upstreamSha](https://github.com/MCMrARM/mc-w10-version-launcher/commit/$upstreamSha), which is newer than the latest upstream release [$env:BASE_TAG](https://github.com/MCMrARM/mc-w10-version-launcher/releases/tag/$env:BASE_TAG), with the changes from ``tools/apply_fixes.py`` applied."
          } else {
            $what = "**Unofficial, modified build** of upstream release [$env:BASE_TAG](https://github.com/MCMrARM/mc-w10-version-launcher/releases/tag/$env:BASE_TAG) by MCMrARM, with the changes from ``tools/apply_fixes.py`` applied."
          }
          @(
            "$what Not affiliated with the original author. Built on $today (UTC)."
            ""
            "Licensed under GPLv3, same as upstream. The complete corresponding source (upstream source with the changes applied) is attached as ``$source``."
            ""
            "- Upstream commit: $upstreamSha"
            "- Fix script commit: $env:GITHUB_SHA"
          ) | Out-File notes.md -Encoding utf8

          $flags = @('--title', $env:RELEASE_TAG, '--notes-file', 'notes.md', "--latest=$env:IS_LATEST", "--prerelease=$env:PRERELEASE")
          if ($env:EXISTS -eq 'true') {
            gh release upload $env:RELEASE_TAG $asset $source --clobber
            gh release edit $env:RELEASE_TAG @flags
          } else {
            gh release create $env:RELEASE_TAG $asset $source @flags --target $env:GITHUB_SHA
          }
